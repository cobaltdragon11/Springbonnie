# Example settings for the Springtrap animatronic. The setup helper (discover.py) writes the real
# config.toml for you; this file shows every option in case you want to edit it by hand.

[board]
address = 0x60          # the Motor HAT's I2C address (0x60 unless the A0-A4 pads are soldered)

[motion]
port = 8765             # the web page connects here
jaw_lead = 0.06         # seconds the jaw moves ahead of the sound; raise if the jaw lags behind his voice
jaw_delay = 0.0         # raise if the jaw moves too early
look_gain_x = 0.9       # how far he turns toward people (0 to 1 of the range you set)
look_gain_y = 0.6
head_smooth = 0.25      # seconds; lower = snappier head
twitches = true         # random animatronic jerks while idle
twitch_every = [7, 18]  # seconds between twitches
idle_without_page = false
rest_after = 30         # seconds without the web page before he goes still

# Roles: jaw, pan (head left/right), tilt (head up/down), eyes_x, eyes_y, glow (LED eyes), gesture
# Kinds: servo (xtra PWM pins 0, 1, 14, 15), stepper (1 = M1+M2, 2 = M3+M4), dc (motor 1-4), led (a Pi GPIO pin)

[[part]]
name = "jaw"
role = "jaw"
kind = "servo"
channel = 0             # xtra PWM pin
closed = 30             # servo angle with the jaw shut
open = 70               # servo angle with the jaw open
# speed = 700           # degrees per second
# min_pulse = 600       # servo pulse range in microseconds (most hobby servos: 500-2500)
# max_pulse = 2400

[[part]]
name = "head turn"
role = "pan"
kind = "servo"
channel = 1
min = 45                # angle when turned to HIS left
center = 90
max = 135               # angle when turned to HIS right

