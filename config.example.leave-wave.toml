# Bench-tested 2026-10-13. M1/M2: negative throttle = arm up. M3: positive = torso toward his left.
[board]
address = 0x60

[motion]
port = 8765
wave_arm = "arm_right"
wave_turn = 0.8
wave_raise = 1.7
wave_count = 3
wave_swing = 0.3
wave_fall = 1.7
wave_cooldown = 15
torso_invert = false
bobble_when_speaking = false

# Head: M4 is the supply (-1.0 turns it on); a transistor per actuator switches it from a Pi pin.
[[part]]
name = "head power"
role = "headpower"
kind = "dc"
motor = 4
max_throttle = 1.0
max_on = 1000000.0

[[part]]
name = "eyes"
role = "glow"
kind = "gpio"
pin = 5
threshold = 0.5

[[part]]
name = "jaw"
role = "jaw"
kind = "gpio"
pin = 6
threshold = 0.35
max_on = 2.0
cool_down = 0.5

[[part]]
name = "head bobble"
role = "bobble"
kind = "gpio"
pin = 12
threshold = 0.5

[[part]]
name = "right arm"
role = "arm_right"
kind = "dc"
motor = 1
max_throttle = 1.0
max_on = 2.5

[[part]]
name = "left arm"
role = "arm_left"
kind = "dc"
motor = 2
max_throttle = 1.0
max_on = 2.5

[[part]]
name = "torso"
role = "torso"
kind = "dc"
motor = 3
max_throttle = 0.5
max_on = 2.5
